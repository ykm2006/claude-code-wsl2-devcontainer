# DevContainer Multi-Environment Configuration
# Environments: minimal, dev, dev-rag
version: '3.8'

# =============================================================================
# Common Configuration (YAML Anchors)
# =============================================================================

# Build arguments - shared across all environments
x-build-args: &build-args
  USERNAME: node
  USER_UID: 1000
  USER_GID: 1000

# Environment variables - shared across all environments
x-common-env: &common-env
  TZ: Asia/Tokyo
  LANG: ja_JP.UTF-8
  LANGUAGE: ja_JP:ja
  LC_ALL: ja_JP.UTF-8
  TERM: xterm-256color

# Volume mounts - shared across all environments
x-volumes: &common-volumes
  - ${HOME}/.claude:/home/node/.claude:cached
  - ..:/workspace:cached

# =============================================================================
# Services
# =============================================================================

